<!DOCTYPE html>
<html>
<head>
    <title>MERSENNE: Revolutionary Mathematical Discovery</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #0a0a0a; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #00ff88; text-align: center; }
        .section { background: #1a1a1a; padding: 20px; margin: 20px 0; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px; border: none; border-radius: 5px; }
        button { background: #00ff88; color: #000; cursor: pointer; }
        button:hover { background: #00cc66; }
        .result { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .prime { color: #00ff88; }
        .composite { color: #ff6666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MERSENNE: Revolutionary Mathematical Discovery System</h1>
        
        <div class="section">
            <h2>Test Mersenne Numbers</h2>
            <input type="number" id="exponent" placeholder="Enter exponent (e.g., 13)" min="1">
            <button onclick="testMersenne()">Test 2^p - 1</button>
            <div id="result"></div>
        </div>
        
        <div class="section">
            <h2>Pattern Analysis</h2>
            <button onclick="analyzePatterns()">Analyze Known Mersenne Primes</button>
            <div id="patterns"></div>
        </div>
        
        <div class="section">
            <h2>Live Status</h2>
            <button onclick="getStatus()">Get System Status</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        async function testMersenne() {
            const exponent = document.getElementById('exponent').value;
            if (!exponent) return alert('Please enter an exponent');
            
            const response = await fetch('/api/test_mersenne', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({exponent: parseInt(exponent)})
            });
            
            const result = await response.json();
            const resultDiv = document.getElementById('result');
            
            if (result.valid) {
                const primeClass = result.is_prime ? 'prime' : 'composite';
                resultDiv.innerHTML = `
                    <div class="result">
                        <h3>2^${result.exponent} - 1</h3>
                        <p><strong>Result:</strong> <span class="${primeClass}">${result.is_prime ? 'PRIME' : 'COMPOSITE'}</span></p>
                        <p><strong>Value:</strong> ${result.mersenne_number}</p>
                        <p><strong>Digits:</strong> ${result.digits}</p>
                        <p><strong>Time:</strong> ${result.computation_time}s</p>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `<div class="result"><p style="color: #ff6666;">Error: ${result.error}</p></div>`;
            }
        }
        
        async function analyzePatterns() {
            const response = await fetch('/api/patterns');
            const patterns = await response.json();
            
            document.getElementById('patterns').innerHTML = `
                <div class="result">
                    <h3>Mersenne Prime Patterns</h3>
                    <p><strong>Total Known:</strong> ${patterns.total_known}</p>
                    <p><strong>Largest Known:</strong> ${patterns.largest_known}</p>
                    <p><strong>Average Gap:</strong> ${patterns.average_gap.toFixed(2)}</p>
                    <p><strong>Min Gap:</strong> ${patterns.min_gap}</p>
                    <p><strong>Max Gap:</strong> ${patterns.max_gap}</p>
                </div>
            `;
        }
        
        async function getStatus() {
            const response = await fetch('/api/status');
            const status = await response.json();
            
            document.getElementById('status').innerHTML = `
                <div class="result">
                    <h3>System Status</h3>
                    <p><strong>Status:</strong> <span class="prime">${status.status.toUpperCase()}</span></p>
                    <p><strong>Known Mersenne Primes:</strong> ${status.known_mersenne_count}</p>
                    <p><strong>Timestamp:</strong> ${new Date(status.timestamp).toLocaleString()}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
